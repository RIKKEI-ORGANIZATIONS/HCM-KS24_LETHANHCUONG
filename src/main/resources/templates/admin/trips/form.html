<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${trip.id == null ? 'Thêm chuyến xe' : 'Sửa chuyến xe'}"></title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      padding:20px;
    }

    h2{
      margin-bottom:20px;
      color:#333;
    }

    .form-box{
      background:white;
      width:500px;
      padding:25px;
      border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .form-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
    }

    input,
    select{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px;
      box-sizing:border-box;
    }

    input:focus,
    select:focus{
      border-color:#007bff;
      outline:none;
    }

    .error{
      color:red;
      font-size:14px;
      margin-top:5px;
    }

    .message-error{
      background:#f8d7da;
      color:#721c24;
      padding:10px;
      border-radius:5px;
      margin-bottom:15px;
    }

    .btn{
      border:none;
      padding:10px 16px;
      border-radius:5px;
      color:white;
      font-weight:bold;
      cursor:pointer;
      text-decoration:none;
    }

    .save{
      background:#007bff;
    }

    .back{
      background:#6c757d;
    }

    .btn-group{
      margin-top:20px;
      display:flex;
      gap:10px;
    }

  </style>

</head>
<body>

<h2 th:text="${trip.id == null ? 'Thêm chuyến xe' : 'Sửa chuyến xe'}"></h2>

<div class="form-box">

  <div class="message-error"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
  </div>

  <form th:action="@{${trip.id} != null
            ? '/admin/trips/update'
            : '/admin/trips/create'}"
        th:object="${trip}"
        method="post">

    <!-- ID -->

    <input type="hidden" th:field="*{id}">

    <!-- ROUTE -->

    <div class="form-group">

      <label>Tuyến đường</label>

      <select th:field="*{route.id}">

        <option value="">-- Chọn tuyến --</option>

        <option th:each="route : ${routes}"
                th:value="${route.id}"
                th:text="${route.fromLocation.name + ' → ' + route.toLocation.name}">
        </option>

      </select>

      <p class="error"
         th:if="${#fields.hasErrors('route')}"
         th:errors="*{route}">
      </p>

    </div>

    <!-- BUS -->

    <div class="form-group">

      <label>Xe</label>

      <select th:field="*{bus.id}">

        <option value="">-- Chọn xe --</option>

        <option th:each="bus : ${buses}"
                th:value="${bus.id}"
                th:text="${bus.companyName + ' - ' + bus.licensePlate + ' / ' + bus.busType}">
        </option>

      </select>

      <p class="error"
         th:if="${#fields.hasErrors('bus')}"
         th:errors="*{bus}">
      </p>

    </div>

    <!-- TIME -->

    <div>
      <label>Giờ khởi hành</label>

      <input type="datetime-local"
             name="departureTime"
             th:value="${trip.departureTime != null ?
           #temporals.format(trip.departureTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
    </div>

    <!-- PRICE -->

    <div class="form-group">

      <label>Giá vé</label>

      <input type="number"
             th:field="*{price}">

      <p class="error"
         th:if="${#fields.hasErrors('price')}"
         th:errors="*{price}">
      </p>

    </div>

    <!-- BUTTON -->

    <div class="btn-group">

      <button type="submit"
              class="btn save">

        <span th:text="${trip.id == null ? 'Thêm chuyến xe' : 'Cập nhật'}"></span>

      </button>

      <a th:href="@{/admin/trips}"
         class="btn back">

        Quay lại

      </a>

    </div>

  </form>

</div>

</body>
</html>
