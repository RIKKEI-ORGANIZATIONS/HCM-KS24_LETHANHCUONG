<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quản lý chuyến xe</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      padding:20px;
    }
    .edit{
      background:#007bff;
    }
    h2{
      margin-bottom:20px;
      color:#333;
    }

    .top-bar{
      margin-bottom:20px;
    }

    .btn{
      border:none;
      padding:10px 16px;
      border-radius:6px;
      color:white;
      text-decoration:none;
      font-weight:bold;
      cursor:pointer;
    }

    .create{
      background:#28a745;
    }

    .delete{
      background:#dc3545;
    }

    .back{
      background:#6c757d;
    }

    table{
      width:100%;
      border-collapse: collapse;
      background:white;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    th, td{
      border:1px solid #ddd;
      padding:12px;
      text-align:center;
    }

    th{
      background:#007bff;
      color:white;
    }

    tr:nth-child(even){
      background:#fafafa;
    }

    .success{
      color:green;
      margin-bottom:15px;
    }

    .error{
      color:red;
      margin-bottom:15px;
    }

  </style>

</head>
<body>

<h2>Quản lý chuyến xe</h2>

<div class="top-bar">

  <a th:href="@{/admin/trips/create}"
     class="btn create">

    + Thêm chuyến xe

  </a>

  <a th:href="@{/}"
     class="btn back">

    Về trang chủ

  </a>

</div>

<p class="success"
   th:if="${successMessage}"
   th:text="${successMessage}">
</p>

<p class="error"
   th:if="${errorMessage}"
   th:text="${errorMessage}">
</p>

<table>

  <thead>

  <tr>

    <th>ID</th>

    <th>Tuyến đường</th>

    <th>Xe</th>

    <th>Tài xế</th>

    <th>Giờ khởi hành</th>

    <th>Giá vé</th>

    <th>Số ghế</th>

    <th>Thao tác</th>

  </tr>

  </thead>

  <tbody>

  <tr th:each="trip : ${trips}">

    <td th:text="${trip.id}"></td>

    <td th:text="${trip.route.fromLocation.name + ' → ' + trip.route.toLocation.name}">
    </td>

    <td th:text="${trip.bus.licensePlate + ' / ' + trip.bus.busType}">
    </td>

    <td th:text="${trip.bus.driverName}">
    </td>

    <td th:text="${#temporals.format(trip.departureTime, 'dd/MM/yyyy HH:mm')}">
    </td>
    </td>

    <td th:text="${#numbers.formatDecimal(trip.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">
    </td>

    <td th:text="${trip.bus.totalSeats}">
    </td>

    <td>

      <div style="display:flex; gap:10px; justify-content:center;">

        <!-- EDIT -->

        <a th:href="@{'/admin/trips/edit/' + ${trip.id}}"
           class="btn edit">

          Sửa

        </a>

        <!-- DELETE -->

        <form th:action="@{'/admin/trips/' + ${trip.id} + '/delete'}"
              method="post">

          <button class="btn delete"
                  onclick="return confirm('Bạn có chắc muốn xóa chuyến xe này?')">

            Xóa

          </button>

        </form>

      </div>

    </td>

  </tr>

  </tbody>

</table>

</body>
</html>
