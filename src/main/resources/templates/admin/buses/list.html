<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý xe</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            padding:20px;
            background:#f5f5f5;
        }

        h2{
            margin-bottom:20px;
            color:#333;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .btn{
            padding:10px 16px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            color:white;
            text-decoration:none;
            font-size:14px;
            font-weight:bold;
        }

        .add-btn{
            background:#28a745;
        }

        .edit-btn{
            background:#007bff;
        }

        .delete-btn{
            background:#dc3545;
        }

        .back-btn{
            background:#6c757d;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        th, td{
            padding:12px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        tr:nth-child(even){
            background:#fafafa;
        }

        .action-box{
            display:flex;
            justify-content:center;
            gap:10px;
        }

        .message{
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
        }

        .success{
            background:#d4edda;
            color:#155724;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
        }

    </style>
</head>

<body>

<div class="top-bar">

    <a href="/" class="btn back-btn">
        ← Trang chủ
    </a>

    <a th:href="@{/admin/buses/new}" class="btn add-btn">
        + Thêm xe
    </a>

</div>

<h2>Quản lý xe</h2>

<div th:if="${successMessage}" class="message success">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="message error">
    <span th:text="${errorMessage}"></span>
</div>

<table>

    <thead>

    <tr>
        <th>ID</th>
        <th>Biển số</th>
        <th>Loại xe</th>
        <th>Số ghế</th>
        <th>Hãng xe</th>
        <th>Tài xế</th>
        <th>Thao tác</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="bus : ${buses}">

        <td th:text="${bus.id}"></td>

        <td th:text="${bus.licensePlate}"></td>

        <td th:text="${bus.busType}"></td>

        <td th:text="${bus.totalSeats}"></td>

        <td th:text="${bus.companyName}"></td>

        <td th:text="${bus.driverName}"></td>

        <td>

            <div class="action-box">

                <a th:href="@{'/admin/buses/edit/' + ${bus.id}}"
                   class="btn edit-btn">

                    Sửa

                </a>

                <form th:action="@{'/admin/buses/' + ${bus.id} + '/delete'}"
                      method="post">

                    <button type="submit"
                            class="btn delete-btn"
                            onclick="return confirm('Bạn có chắc muốn xóa xe này?')">

                        Xóa

                    </button>

                </form>

            </div>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
