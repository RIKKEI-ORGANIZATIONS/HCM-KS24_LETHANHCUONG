<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h2>Đăng nhập</h2>

<p th:if="${param.error}" style="color:red">Sai username hoặc password</p>
<p th:if="${param.logout}" style="color:green">Đã đăng xuất</p>
<p th:if="${param.registerSuccess}" style="color:green">Đăng ký thành công, hãy đăng nhập</p>

<form th:action="@{/login}" method="post">
    <div>
        <label>Username</label>
        <input type="text" name="username">
    </div>
    <div>
        <label>Password</label>
        <input type="password" name="password">
    </div>
    <button type="submit">Login</button>
</form>

<p><a th:href="@{/register}">Đăng ký</a></p>
</body>
</html>
