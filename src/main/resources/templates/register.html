<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<h2>Đăng ký hành khách</h2>

<form th:action="@{/register}" th:object="${form}" method="post">
    <div>
        <label>Username</label>
        <input type="text" th:field="*{username}">
        <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red"></p>
    </div>

    <div>
        <label>Password</label>
        <input type="password" th:field="*{password}">
        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red"></p>
    </div>

    <div>
        <label>Họ tên</label>
        <input type="text" th:field="*{fullName}">
        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color:red"></p>
    </div>

    <div>
        <label>SĐT</label>
        <input type="text" th:field="*{phone}">
        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" style="color:red"></p>
    </div>

    <div>
        <label>Email</label>
        <input type="text" th:field="*{email}">
        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></p>
    </div>

    <div>
        <label>Địa chỉ</label>
        <input type="text" th:field="*{address}">
    </div>

    <button type="submit">Đăng ký</button>
</form>

<p><a th:href="@{/login}">Quay lại login</a></p>
</body>
</html>
