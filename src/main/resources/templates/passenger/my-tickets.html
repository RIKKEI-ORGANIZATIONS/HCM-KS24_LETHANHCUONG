
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vé của tôi</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:20px;
        }

        h2{
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
        }

        th, td{
            padding:12px;
            border:1px solid #ddd;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        .paid{
            color:green;
            font-weight:bold;
        }

        .pending{
            color:orange;
            font-weight:bold;
        }

        .cancelled{
            color:red;
            font-weight:bold;
        }

        .btn{
            padding:8px 14px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            color:white;
        }

        .cancel{
            background:red;
        }

        .back{
            background:#6c757d;
            text-decoration:none;
            display:inline-block;
            margin-bottom:20px;
        }

        .message{
            padding:10px;
            margin-bottom:15px;
            border-radius:5px;
        }

        .success{
            background:#d4edda;
            color:#155724;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
        }

    </style>

</head>
<body>

<a href="/" class="btn back">← Trang chủ</a>

<h2>Vé của tôi</h2>

<div th:if="${successMessage}" class="message success">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage}" class="message error">
    <span th:text="${errorMessage}"></span>
</div>

<table>

    <thead>
    <tr>
        <th>Mã vé</th>
        <th>Tuyến</th>
        <th>Ghế</th>
        <th>Giờ đi</th>
        <th>Giá</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="ticket : ${tickets}">

        <td th:text="${ticket.ticketCode}"></td>

        <td th:text="${ticket.trip.route.fromLocation.name + ' → ' + ticket.trip.route.toLocation.name}">
        </td>

        <td th:text="${ticket.seat.seatNumber}"></td>

        <td th:text="${ticket.trip.departureTime}"></td>

        <td th:text="${ticket.totalPrice}"></td>

        <td>

            <span class="pending"
                  th:if="${ticket.status.name() == 'PENDING'}">
                Chờ thanh toán
            </span>

            <span class="paid"
                  th:if="${ticket.status.name() == 'PAID'}">
                Đã thanh toán
            </span>

            <span class="cancelled"
                  th:if="${ticket.status.name() == 'CANCELLED'}">
                Đã hủy
            </span>

        </td>

        <td>

            <form th:if="${ticket.status.name() == 'PENDING'}"
                  th:action="@{'/tickets/' + ${ticket.id} + '/cancel'}"
                  method="post">

                <button class="btn cancel"
                        onclick="return confirm('Bạn có chắc muốn hủy vé?')">
                    Hủy vé
                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

</body>
</html>
