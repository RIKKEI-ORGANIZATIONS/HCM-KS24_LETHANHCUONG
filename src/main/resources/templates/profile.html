<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .profile-container{
            width:100%;
            max-width:500px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .success{
            background:#d4edda;
            color:#155724;
            padding:10px;
            border-radius:8px;
            margin-bottom:20px;
            text-align:center;
            font-weight:bold;
        }

        .form-group{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
            transition:0.3s;
        }

        input:focus{
            border-color:#007bff;
            outline:none;
            box-shadow:0 0 5px rgba(0,123,255,0.3);
        }

        .error{
            color:red;
            font-size:14px;
            margin-top:5px;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#007bff;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#0056b3;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:18px;
            text-decoration:none;
            color:#555;
            font-weight:bold;
        }

        .back:hover{
            color:#007bff;
        }

    </style>

</head>

<body>

<div class="profile-container">

    <h2>Hồ sơ cá nhân</h2>

    <p th:if="${param.success}" class="success">
        Cập nhật thành công
    </p>

    <form th:action="@{/profile}"
          th:object="${form}"
          method="post">

        <div class="form-group">
            <label>Họ tên</label>

            <input type="text"
                   th:field="*{fullName}">

            <p class="error"
               th:if="${#fields.hasErrors('fullName')}"
               th:errors="*{fullName}">
            </p>
        </div>

        <div class="form-group">
            <label>SĐT</label>

            <input type="text"
                   th:field="*{phone}">

            <p class="error"
               th:if="${#fields.hasErrors('phone')}"
               th:errors="*{phone}">
            </p>
        </div>

        <div class="form-group">
            <label>Email</label>

            <input type="text"
                   th:field="*{email}">

            <p class="error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">
            </p>
        </div>

        <div class="form-group">
            <label>Địa chỉ</label>

            <input type="text"
                   th:field="*{address}">
        </div>

        <button type="submit" class="btn">
            Lưu thay đổi
        </button>

    </form>

    <a th:href="@{/}" class="back">
        ← Về trang chủ
    </a>

</div>

</body>
</html>
